<style>

<script>/* ==== core/util ==== */
/* JIMMY RACING - util.js
 * Pure math helpers shared by the simulation (runs in browser and Node).
 * Conventions used everywhere in the project:
 *   - World axes follow Three.js: +Y up, heading 0 = +Z, forward = (sin h, cos h).
 *   - "Left" vector of heading h is (cos h, -sin h). Lateral offsets are LEFT-positive.
 *   - Yaw rate and steering angle are positive when turning LEFT.
 */
(function () {
  var JR = (typeof globalThis !== 'undefined' ? globalThis : window);
  JR.JR = JR.JR || {};
  var NS = JR.JR;

  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function wrapAngle(a) {
    a = a % TAU;
    if (a > Math.PI) a -= TAU;
    else if (a < -Math.PI) a += TAU;
    return a;
  }
  /* Frame-rate independent exponential smoothing. */
  function damp(cur, target, lambda, dt) {
    return lerp(cur, target, 1 - Math.exp(-lambda * dt));
  }
  function sign(v) { return v < 0 ? -1 : 1; }

  /* Deterministic RNG (mulberry32). */
  function makeRng(seed) {
    var a = seed >>> 0;
    var rng = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    rng.range = function (lo, hi) { return lo + (hi - lo) * rng(); };
    rng.int = function (lo, hi) { return Math.floor(lo + (hi - lo + 1) * rng()); };
    rng.pick = function (arr) { return arr[Math.floor(rng() * arr.length)]; };
    return rng;
  }

  /* Cheap 2D value noise + fBm (used for terrain & textures; deterministic). */
  function hash2(ix, iz, seed) {
    var h = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(seed | 0, 2147483647)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h = h ^ (h >>> 16);
    return (h >>> 0) / 4294967296;
  }
  function valueNoise(x, z, seed) {
    var ix = Math.floor(x), iz = Math.floor(z);
    var fx = x - ix, fz = z - iz;
    var ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
    var a = hash2(ix, iz, seed), b = hash2(ix + 1, iz, seed);
    var c = hash2(ix, iz + 1, seed), d = hash2(ix + 1, iz + 1, seed);
    return lerp(lerp(a, b, ux), lerp(c, d, ux), uz);
  }
  function fbm(x, z, seed, octaves) {
    var sum = 0, amp = 0.5, f = 1, norm = 0;
    for (var o = 0; o < (octaves || 4); o++) {
      sum += amp * valueNoise(x * f, z * f, (seed || 0) + o * 101);
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return sum / norm; // 0..1
  }

  function fmtTime(sec) {
    if (sec == null || !isFinite(sec)) return '--:--.---';
    var m = Math.floor(sec / 60);
    var s = sec - m * 60;
    var whole = Math.floor(s);
    var ms = Math.round((s - whole) * 1000);
    if (ms === 1000) { ms = 0; whole += 1; if (whole === 60) { whole = 0; m += 1; } }
    return (m < 10 ? '0' : '') + m + ':' + (whole < 10 ? '0' : '') + whole + '.' + ('00' + ms).slice(-3);
  }

  NS.util = {
    TAU: TAU, clamp: clamp, lerp: lerp, smoothstep: smoothstep, wrapAngle: wrapAngle,
    damp: damp, sign: sign, makeRng: makeRng, valueNoise: valueNoise, fbm: fbm, fmtTime: fmtTime
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NS;
})();

/* ==== core/track ==== */
/* JIMMY RACING - track.js
 * Circuit "Sierra Verde GP": closed spline, uniform arc-length samples, lateral queries,
 * surface classification, racing line (used by the AI) and layout of scenery features.
 * No rendering code here, so the exact same data drives physics, AI, HUD and meshes.
 */
(function () {
  var G = (typeof globalThis !== 'undefined' ? globalThis : window);
  G.JR = G.JR || {};
  var JR = G.JR;
  var U = JR.util;
  var clamp = U.clamp, wrapAngle = U.wrapAngle;

  /* [x, z, y(height)] control points, driven in order, closed loop. Start/finish line is at
   * s = 0, which is the first control point region (long main straight heading +Z). */
  /* Rounded-rectangle circuit generator: four long straights joined by four 90-degree corners (radius CR).
   * p = { HX, HZ (half sides), CR, hgt:[4 side heights], bump:[4 lateral sway amplitudes (m)] }.
   * Counter-clockwise (heading increases = left turns). The line is the middle of the first straight (heading +Z). */
  var DEFAULT_CIRCUIT = { HX: 640, HZ: 640, CR: 170, hgt: [0, 2.5, 4, 2.5], bump: [0, 0, 0, 0] };
  function makeControls(p) {
    p = p || DEFAULT_CIRCUIT;
    var HX = p.HX, HZ = p.HZ, CR = p.CR, hgt = p.hgt || DEFAULT_CIRCUIT.hgt, bump = p.bump || [0, 0, 0, 0], pts = [];
    var C = [[-HX + CR, HZ - CR], [HX - CR, HZ - CR], [HX - CR, -HZ + CR], [-HX + CR, -HZ + CR]];
    function y(k, f) { return hgt[k] + (hgt[(k + 1) % 4] - hgt[k]) * f; }
    pts.push([-HX, 0, hgt[0]]);
    for (var k = 0; k < 4; k++) {
      var c = C[k];
      var base = (k === 0) ? Math.PI : (k === 1) ? Math.PI / 2 : (k === 2) ? 0 : -Math.PI / 2;
      var sx = c[0] + CR * Math.cos(base), sz = c[1] + CR * Math.sin(base);
      var px = pts[pts.length - 1];
      // heading of side k: +Z, +X, -Z, -X ; its left normal: (cos h, -sin h)
      var hd = k * Math.PI / 2 + (k === 0 ? 0 : 0), nxk = Math.cos(hd), nzk = -Math.sin(hd);
      for (var q = 1; q <= 3; q++) {
        var f = q / 4, X = px[0] + (sx - px[0]) * f, Z = px[1] + (sz - px[1]) * f;
        var sw = k === 0 ? 0 : bump[k] * Math.sin(Math.PI * f);               // side 0 stays straight (start/finish)
        pts.push([X + nxk * sw, Z + nzk * sw, y(k, 0.4 + 0.2 * f)]);
      }
      pts.push([sx, sz, y(k, 0.65)]);
      for (var j = 1; j <= 4; j++) { var ang = base - j * Math.PI / 8; pts.push([c[0] + CR * Math.cos(ang), c[1] + CR * Math.sin(ang), y(k, 0.7 + 0.05 * j)]); }
    }
    var last = pts[pts.length - 1], tx = -HX, tz = 0;
    for (var q2 = 1; q2 <= 2; q2++) { var f2 = q2 / 3; pts.push([last[0] + (tx - last[0]) * f2, last[1] + (tz - last[1]) * f2, last[2] * (1 - f2)]); }
    return pts;
  }
  var CONTROLS = makeControls(DEFAULT_CIRCUIT);

  var DS = 2.0;                 // arc-length step between samples (m)
  var BARRIER_OFFSET = 14.0;    // base distance from the asphalt edge to the guardrail on straights (m)
  var ESCAPE_OUT = 24.0;        // extra run-off on the OUTSIDE of a corner at full curvature (m)
  var TUNNEL_CLEAR = 1.0;       // tunnel wall distance from the asphalt edge (m)
  var ESCAPE_IN = 7.0;          // extra run-off on the inside (m)
  var KERB_W = 1.4;
  var GRAVEL_W = 3.6;

  /* Centripetal Catmull-Rom point on segment p1->p2 */
  function crPoint(p0, p1, p2, p3, t) {
    function tj(ti, a, b) {
      var dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
      return ti + Math.pow(Math.sqrt(dx * dx + dy * dy + dz * dz) + 1e-6, 0.5);
    }
    var t0 = 0, t1 = tj(t0, p0, p1), t2 = tj(t1, p1, p2), t3 = tj(t2, p2, p3);
    var tt = t1 + (t2 - t1) * t;
    var out = [0, 0, 0];
    for (var k = 0; k < 3; k++) {
      var A1 = ((t1 - tt) * p0[k] + (tt - t0) * p1[k]) / (t1 - t0);
      var A2 = ((t2 - tt) * p1[k] + (tt - t1) * p2[k]) / (t2 - t1);
      var A3 = ((t3 - tt) * p2[k] + (tt - t2) * p3[k]) / (t3 - t2);
      var B1 = ((t2 - tt) * A1 + (tt - t0) * A2) / (t2 - t0);
      var B2 = ((t3 - tt) * A2 + (tt - t1) * A3) / (t3 - t1);
      out[k] = ((t2 - tt) * B1 + (tt - t1) * B2) / (t2 - t1);
    }
    return out;
  }

  function build(opts) {
    opts = opts || {};
    var circ = opts.circuit || DEFAULT_CIRCUIT, ctrl = opts.controls || (opts.circuit ? makeControls(circ) : CONTROLS);
    var n = ctrl.length;
    // 1) dense spline
    var dense = [];
    var SUB = 48;
    for (var i = 0; i < n; i++) {
      var p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
      for (var j = 0; j < SUB; j++) dense.push(crPoint(p0, p1, p2, p3, j / SUB));
    }
    var m = dense.length;
    var cum = new Float64Array(m + 1);
    for (var a = 0; a < m; a++) {
      var A = dense[a], B = dense[(a + 1) % m];
      // dense points are [x, z, y]; arc length s is measured horizontally
      var dx = B[0] - A[0], dz = B[1] - A[1];
      cum[a + 1] = cum[a] + Math.sqrt(dx * dx + dz * dz);
    }
    var total = cum[m];
    var N = Math.round(total / DS);
    var ds = total / N;

    // 2) uniform resample
    var X = new Float32Array(N), Z = new Float32Array(N), Y = new Float32Array(N);
    var seg = 0;
    for (var s = 0; s < N; s++) {
      var target = s * ds;
      while (seg < m - 1 && cum[seg + 1] < target) seg++;
      var A2 = dense[seg], B2 = dense[(seg + 1) % m];
      var span = cum[seg + 1] - cum[seg];
      var f = span > 1e-9 ? (target - cum[seg]) / span : 0;
      X[s] = A2[0] + (B2[0] - A2[0]) * f;
      Z[s] = A2[1] + (B2[1] - A2[1]) * f;
      Y[s] = A2[2] + (B2[2] - A2[2]) * f;
    }
    // smooth heights slightly (removes spline wobble) - circular box filter
    var Ys = new Float32Array(N);
    for (var pass = 0; pass < 3; pass++) {
      for (var q = 0; q < N; q++) {
        var acc = 0;
        for (var w = -6; w <= 6; w++) acc += Y[(q + w + N) % N];
        Ys[q] = acc / 13;
      }
      Y.set(Ys);
    }

    // 3) tangents, headings, curvature
    var TX = new Float32Array(N), TZ = new Float32Array(N), HEAD = new Float32Array(N), K = new Float32Array(N);
    for (var t = 0; t < N; t++) {
      var pn = (t + 1) % N, pp = (t - 1 + N) % N;
      var tx = X[pn] - X[pp], tz = Z[pn] - Z[pp];
      var l = Math.sqrt(tx * tx + tz * tz);
      TX[t] = tx / l; TZ[t] = tz / l;
      HEAD[t] = Math.atan2(TX[t], TZ[t]);
    }
    for (var c = 0; c < N; c++) {
      var h1 = HEAD[(c + 3) % N], h0 = HEAD[(c - 3 + N) % N];
      K[c] = wrapAngle(h1 - h0) / (6 * ds);
    }
    // smooth curvature a little
    var Ks = new Float32Array(N);
    for (var ps = 0; ps < 2; ps++) {
      for (var u = 0; u < N; u++) {
        Ks[u] = (K[(u - 2 + N) % N] + 2 * K[(u - 1 + N) % N] + 3 * K[u] + 2 * K[(u + 1) % N] + K[(u + 2) % N]) / 9;
      }
      K.set(Ks);
    }

    // 4) width profile: wide on the main straight and at corner entries, narrower in the hairpin
    var W = new Float32Array(N);
    // main-straight widening: 16 m from the corner exit before the line to the T1 braking zone
    for (var wj = 0; wj < N; wj++) {
      var sj = wj * ds;
      var widen = sj < 520 ? 1 - U.smoothstep(400, 520, sj) : (sj > total - 200 ? U.smoothstep(total - 200, total - 110, sj) : 0);
      W[wj] = 18 + 4 * widen;
    }

    // 4b) guard-rail distance per side: uniform on straights, widening smoothly into corners (escape zones).
    //     d > 0 is the LEFT side; heading increases when turning left (k > 0 => left corner, outer side = d < 0).
    var BL = new Float32Array(N), BR = new Float32Array(N), fo = new Float32Array(N), fi = new Float32Array(N);
    function cf(k) { return U.smoothstep(1 / 1200, 1 / 190, Math.abs(k)); }   // 0 on straights/fast bends, 1 in tight corners
    var sgn = new Float32Array(N);
    for (var bi0 = 0; bi0 < N; bi0++) sgn[bi0] = K[bi0];
    var HOLD = Math.round(80 / ds), BLUR = Math.round(110 / ds);
    var fL = new Float32Array(N), fR = new Float32Array(N);    // factor for left-outer (right turns) / right-outer (left turns)
    for (var bi1 = 0; bi1 < N; bi1++) { fL[bi1] = sgn[bi1] < 0 ? cf(sgn[bi1]) : 0; fR[bi1] = sgn[bi1] > 0 ? cf(sgn[bi1]) : 0; }
    function holdBlur(a) {
      var m = new Float32Array(N), o = new Float32Array(N), q, j;
      for (q = 0; q < N; q++) { var mx = 0; for (j = -HOLD; j <= HOLD; j += 2) mx = Math.max(mx, a[(q + j + N) % N]); m[q] = mx; }
      for (q = 0; q < N; q++) { var sm = 0, cn = 0; for (j = -BLUR; j <= BLUR; j++) { var wgt = 1 - Math.abs(j) / (BLUR + 1); sm += m[(q + j + N) % N] * wgt; cn += wgt; } o[q] = sm / cn; }
      return o;
    }
    var gL = holdBlur(fL), gR = holdBlur(fR);                  // outer-side factors (left side / right side)
    for (var bi2 = 0; bi2 < N; bi2++) {
      // the inner side of a corner is the outer side of the opposite factor
      BL[bi2] = BARRIER_OFFSET + ESCAPE_OUT * gL[bi2] + ESCAPE_IN * gR[bi2];
      BR[bi2] = BARRIER_OFFSET + ESCAPE_OUT * gR[bi2] + ESCAPE_IN * gL[bi2];

    '  return normalize(T * im * nt.x + B * im * nt.y + N * nt.z); }',
    'float shadowLookup(sampler2DShadow s, mat4 vp, vec3 wp, vec3 n, float texel, float bias){',
    '  vec3 pos = wp + n * texel * 2.2;',
    '  vec4 lp = vp * vec4(pos, 1.); vec3 c = lp.xyz * .5 + .5;',
    '  if (c.x < .02 || c.x > .98 || c.y < .02 || c.y > .98 || c.z > 1.) return -1.;',
    '  c.z -= bias;',
    '  vec2 t = vec2(texel * 0.0); float sum = 0.;',
    '  const float k = 1.;',
    '  vec2 px = vec2(1.) / vec2(textureSize(s, 0));',
    '  for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) sum += texture(s, vec3(c.xy + vec2(float(x), float(y)) * px * 1.15, c.z));',
    '  return sum / 9.; }',
    'float sunShadow(vec3 wp, vec3 n, float nl){',
    '  float bias = .0006 + .0016 * (1. - nl);',
    '  float s = shadowLookup(uShadow0, uLVP0, wp, n, uCascTexel.x, bias);',
    '  if (s >= 0.) return s;',
    '  if (uNCasc > 1) { s = shadowLookup(uShadow1, uLVP1, wp, n, uCascTexel.y, bias * 1.4); if (s >= 0.) return s; }',
    '  if (uNCasc > 2) { s = shadowLookup(uShadow2, uLVP2, wp, n, uCascTexel.z, bias * 1.8); if (s >= 0.) return s; }',
    '  return 1.; }',
    'void main(){',
    '  if (vWorld.y < uClipY) discard;',
    '  vec2 uv = vUV * uTexScale;',
    '#ifdef CAR',
    '  if (uArch.w > 0. && abs(vLoc.x) > uCarHalf.y * .62) { float dyA = vLoc.y - uArch.z; float dA = min(dyA > 0. ? length(vec2(vLoc.z - uArch.x, dyA)) : abs(vLoc.z - uArch.x), dyA > 0. ? length(vec2(vLoc.z - uArch.y, dyA)) : abs(vLoc.z - uArch.y)); if (dA < uArch.w) discard; }',
    '#endif',
    '  vec4 t0 = texture(uTex0, uv); vec4 t1 = texture(uTex1, uv);',
    '#ifdef TERRAIN',
    '  { vec2 uv2 = uv * .37 + vec2(.31, .17); vec4 r0 = texture(uTex2, uv2); vec4 r1 = texture(uTex3, uv2);',
    '    float sp = vCol.a; t0 = mix(t0, r0, sp); t1 = mix(t1, r1, sp); }',
    '#endif',
    '  vec3 albedo = t0.rgb * vCol.rgb * vTint.rgb * uBase.rgb * uTintMul.rgb;',
    '  float alpha = uBase.a * vTint.a;',
    '#ifdef ALPHATEST',
    '  if (t0.a * alpha < uAlphaCut) discard;',
    '#endif',
    '#ifdef TERRAIN',
    '  float ao = 1.;',
    '#else',
    '  float ao = vCol.a;',
    '#endif',
    '  // ---- analytic contact occlusion under / around every car (rounded-box footprint + 4 tyre contact patches) ----',
    '  float carOcc = 0.;',
    '#ifndef CAR',
    '  for (int i = 0; i < 8; i++) { if (i >= uNAO) break;',
    '    vec4 a0 = uAO0[i], a1 = uAO1[i], a2 = uAO2[i];',
    '    float hh = vWorld.y - a1.z; if (hh < -.4 || hh > .9) continue;',
    '    vec2 dd0 = vWorld.xz - a0.xy; float lz = dd0.x * a0.z + dd0.y * a0.w; float lx = dd0.x * a0.w - dd0.y * a0.z;',
    '    vec2 q = abs(vec2(lx, lz)) - (a1.xy - .45); float sdb = length(max(q, 0.)) + min(max(q.x, q.y), 0.) - .45;',
    '    float hv = 1. - smoothstep(.1, .8, hh);',
    '    float body = (1. - smoothstep(-.1, .9, sdb)); body = body * body * hv;',
    '    float wc = 0.;',
    '    for (int w = 0; w < 4; w++) { vec2 wp = vec2((w & 1) == 0 ? a2.x : -a2.x, w < 2 ? a2.y : a2.z); vec2 dw = (vec2(lx, lz) - wp) / vec2(a2.w * .62, a2.w * 1.3); wc = max(wc, 1. - smoothstep(.45, 1.8, length(dw))); }',
    '    carOcc = max(carOcc, max(body * .72, wc * .9 * hv));',
    '  }',
    '  ao *= 1. - .85 * carOcc;',
    '#endif',
    '  vec3 Ng = normalize(vN); if (!gl_FrontFacing) Ng = -Ng;',
    '  vec3 V = normalize(uCam - vWorld); float dist = length(uCam - vWorld);',
    '  vec2 nxy = t1.rg * 2. - 1.;',
    '  vec3 N = perturb(Ng, vWorld, uv, nxy, uNormStr);',
    '  float rough = clamp(t1.b * uRough, .04, 1.);',
    '  float metal = uMetal;',
    '  vec3 emis = uEmis * (1. + t1.a * 6.) * step(.001, uEmis.x + uEmis.y + uEmis.z);',
    '#ifdef EMISMASK',
    '  emis = uEmis * t1.a;',
    '#endif',
    '#ifdef CAR',
    '  if (uFlake > 0.) { vec3 fl = floor(vWorld * 260.); vec3 fn = vec3(hash13(fl), hash13(fl + 7.1), hash13(fl + 13.7)) - .5; N = normalize(N + fn * uFlake * .35); }',
    '#endif',
    '  // ---- wet / snow surface modification (ground materials) ----',
    '  float wetMask = 0.;',
    '  if (uWetAffect > 0.) {',
    '    float pud = fbm3(vWorld.xz * .09 + 3.1) * .7 + fbm3(vWorld.xz * .55) * .3;',
    '    wetMask = clamp(uWet * (.55 + 1.5 * smoothstep(.42, .62, pud) ), 0., 1.) * uWetAffect;',
    '    albedo *= mix(1., .55, wetMask); rough = mix(rough, .06, wetMask * .92);',
    '    N = normalize(mix(N, Ng, wetMask * .6));',
    '  }',
    '  if (uSnow > 0. && uWetAffect > 0.) { float sn = clamp(uSnow * (.8 + .4 * fbm3(vWorld.xz * .3)), 0., 1.) * smoothstep(.55, .9, Ng.y);',
    '    albedo = mix(albedo, vec3(.82, .86, .92), sn); rough = mix(rough, .75, sn); metal *= 1. - sn; }',
    '  float nv = max(dot(N, V), 1e-3);',
    '  vec3 f0 = mix(vec3(.04) * uSpec, albedo, metal);',
    '  vec3 diffCol = albedo * (1. - metal);',
    '  float a = rough * rough;',
    '  // ---- sun ----',
    '  float nlg = max(dot(Ng, uSunDir), 0.);',
    '  float nl = max(dot(N, uSunDir), 0.);',
    '  float sh = 1.;',
    '  if (uNCasc > 0 && nlg > 0.) sh = sunShadow(vWorld, Ng, nlg);',
    '  sh = min(sh, 1. - .8 * carOcc);',
    '  vec3 H = normalize(V + uSunDir);',
    '  float nh = max(dot(N, H), 0.), vh = max(dot(V, H), 0.);',
    '  vec3 F = F_Schlick(f0, vh);',
    '  vec3 spec = D_GGX(nh, a) * V_Smith(nv, nl, a) * F;',
    '  vec3 col = (diffCol * (1. - F) / PI + spec) * uSunCol * nl * sh;',
    '  // ---- clearcoat (car paint) ----',
    '#ifdef CAR',
    '  if (uClear > 0.) {',
    '    float ccr = .05; float aa = ccr * ccr; float Fc = .04 + .96 * pow(1. - vh, 5.);',
    '    col += D_GGX(nh, aa) * V_Smith(nv, nl, aa) * Fc * uSunCol * nl * sh * uClear;',
    '  }',
    '#endif',
    '  // ---- ambient / IBL from the analytic sky ----',
    '  vec3 R = reflect(-V, N);',
    '  float up = N.y * .5 + .5;',
    '  vec3 amb = mix(uGround, uSkyAmb, up) * uAmb;',
    '  col += diffCol * amb * ao;',
    '  vec3 Rsky = R; if (Rsky.y < 0.) Rsky.y = abs(Rsky.y) * .25;',
    '  vec3 envSky = mix(skyBase(normalize(Rsky), 1.), uSkyAmb * 1.1, rough * rough * .85);',
    '  float horizonOcc = clamp(1. + 1.4 * dot(R, Ng), 0., 1.);',
    '  vec3 spAmb = envBRDF(f0, rough, nv);',
    '  vec3 envCol = envSky * spAmb * mix(.35, 1., sh) * ao * horizonOcc;',
    '#ifdef REFL',
    '  if (uReflOn > 0. && wetMask > .02) {',
    '    vec2 suv = gl_FragCoord.xy / uViewport; suv.x += N.x * .02; suv.y += (N.z * .012);',
    '    vec3 rc = texture(uReflTex, vec2(suv.x, suv.y)).rgb;',
    '    float fr = F_Schlick(vec3(.02), nv).x * 1.0 + .06;',
    '    envCol = mix(envCol, rc * (fr * 4. + .15), clamp(wetMask * .85, 0., 1.));',
    '  }',
    '#endif',
    '#ifdef CAR',
    '  if (uClear > 0.) { float Fc2 = .04 + .96 * pow(1. - nv, 5.); envCol += envSky * Fc2 * uClear * ao * .55; }',
    '#endif',
    '  col += envCol;',
    '  // ---- spot lights (headlights) ----',
    '  for (int i = 0; i < 8; i++) {',
    '    if (i >= uNSpot) break;',
    '    vec3 Lv = uSpot[i].xyz - vWorld; float d = length(Lv); if (d > uSpot[i].w) continue; Lv /= d;',
    '    float cone = smoothstep(uSpotD[i].w, uSpotC[i].w, dot(-Lv, uSpotD[i].xyz));',
    '    float att = pow(clamp(1. - d / uSpot[i].w, 0., 1.), 2.) / (1. + d * d * .0025);',
    '    vec3 Ns = normalize(mix(N, Ng, .65));',
    '    float snl = max(dot(Ns, Lv), 0.);',
    '    vec3 Hs = normalize(V + Lv); float snh = max(dot(Ns, Hs), 0.);',
    '    vec3 sp = D_GGX(snh, a) * V_Smith(nv, snl, a) * F_Schlick(f0, max(dot(V, Hs), 0.));',
    '    col += (diffCol / PI + sp) * uSpotC[i].rgb * snl * cone * att * 60.;',
    '  }',
    '  col += emis;',
    '  // ---- fog ----',
    '  vec3 vv = vWorld - uCam; float dd = length(vv); vec3 dir = vv / max(dd, 1e-3);',
    '  float avgH = (uCam.y + vWorld.y) * .5;',
    '  float den = uFogDen * exp(-uFogHF * max(avgH - uFogBase, 0.));',
    '  float fa = 1. - exp(-den * dd);',

    '  float Fg = .04 + .96 * pow(1. - nv, 4.);',
    '  alpha = clamp(alpha + Fg * .8, 0., 1.);',

    '  oColor = vec4(col, alpha);',
    '}'
  ].join('\n');

  /* ------------------------------------------------------------ shadow pass */
  S.shadowVS = [
    'precision highp float;',
    'in vec3 aPos; in vec2 aUV; in vec4 aM0; in vec4 aM1; in vec4 aM2; in vec4 aTint; in vec4 aCol;',
    'uniform mat4 uLVP; out vec2 vUV;',

  ].join('\n');
  S.shadowFS = [
    'precision highp float; in vec2 vUV; out vec4 o; uniform sampler2D uTex0; uniform vec2 uTexScale; uniform float uAlphaCut;',
    'void main(){',
    '#ifdef ALPHATEST',
    '  if (texture(uTex0, vUV * uTexScale).a < uAlphaCut) discard;',
    '#endif',
    '  o = vec4(1.); }'

  /* ------------------------------------------------------------ sky */
  S.skyVS = [
    'precision highp float; out vec2 vP;',
    'void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vP = p * 2. - 1.; gl_Position = vec4(vP, 1., 1.); }'
  ].join('\n');
  S.skyFS = [
    'precision highp float; in vec2 vP; out vec4 oColor;',
    NOISE, SKY_COMMON,
    'uniform mat4 uInvVP; uniform vec3 uCam; uniform vec2 uWind; uniform vec3 uCloudCol;',
    'float stars(vec3 d){ vec2 p = d.xz / (abs(d.y) + .6) * 90.; vec2 i = floor(p), f = fract(p) - .5;',
    '  float h = hash12(i); float s = smoothstep(.97, 1., h); float r = length(f + (vec2(hash12(i + 3.1), hash12(i + 8.7)) - .5) * .5);',
    '  return s * smoothstep(.12, .0, r) * (.5 + .5 * hash12(i + 1.7)) * 2.5; }',
    'void main(){',
    '  vec4 w = uInvVP * vec4(vP, 1., 1.); vec3 d = normalize(w.xyz / w.w - uCam);',
    '  vec3 col = skyBase(d, 1.);',
    '  if (d.y > 0.) {',
    '    vec2 cp = d.xz / (d.y + .14) * 1.1 + uTime * uWind * .012;',
    '    float n = fbm(cp * .8); float n2 = fbm(cp * 2.3 + 5.);',
    '    float cov = uCloud; float c = smoothstep(1. - cov - .02, 1. - cov + .30, n * .8 + n2 * .35);',

    '    vec3 cc = uCloudCol * (shade * lit + pow(max(dot(d, uSunDir), 0.), 12.) * .5 * (1. - c * .5));',
    '    col = mix(col, cc, c * (.92 - uNight * .2));',
    '    col += vec3(.75, .85, 1.) * stars(d) * uNight * (1. - c);',
    '    float md = max(dot(d, uMoonDir), 0.);',
    '    col += vec3(.9, .95, 1.) * smoothstep(.9992, .9997, md) * 1.6 * uNight * (1. - c);',
    '  }',
    '  oColor = vec4(col, 1.);',
    '}'
  ].join('\n');

  /* ------------------------------------------------------------ particles (instanced billboards) */
  S.partVS = [
    'precision highp float;',
    'in vec4 aI0; in vec4 aI1; in vec4 aI2;',  /* pos.xyz,size | color rgba | rot, kind, soft, stretch */
    'uniform mat4 uViewProj; uniform vec3 uCamRight; uniform vec3 uCamUp; uniform vec3 uCam;',
    'out vec2 vUV; out vec4 vCol; out float vKind; out float vSoft;',
    'void main(){',
    '  vec2 q = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1)) * 2. - 1.;',
    '  vUV = q; vCol = aI1; vKind = aI2.y; vSoft = aI2.z;',
    '  float s = aI0.w; float rot = aI2.x;',
    '  float c = cos(rot), sn = sin(rot);',
    '  vec2 r = vec2(q.x * c - q.y * sn, q.x * sn + q.y * c);',
    '  vec3 right = uCamRight, up = uCamUp;',
    '  vec3 wp;',
    '  if (aI2.w > 0.) {',   /* velocity-stretched streak: aI2.x holds nothing, direction in aI0? use rot as dir encoded below */

  S.partFS = [
    'precision highp float; in vec2 vUV; in vec4 vCol; in float vKind; in float vSoft; out vec4 oColor;',
    NOISE,
    'uniform float uExposureAdd;',
    'void main(){',
    '  float r2 = dot(vUV, vUV); if (r2 > 1.) discard;',
    '  float a;',
    '  if (vKind < .5) {',           /* smoke puff: soft noisy disc */
    '    float n = vnoise(vUV * 2.4 + vCol.rg * 31.); a = smoothstep(1., .15, sqrt(r2)) * (.65 + .6 * n); }',
    '  else if (vKind < 1.5) {',     /* spark / ember: bright core */
    '    a = pow(1. - sqrt(r2), 2.2); }',
    '  else if (vKind < 2.5) {',     /* rain streak (vertical) */

  /* ------------------------------------------------------------ decals / skidmarks / unlit-ish */
  S.decalFS = [
    'precision highp float;',
    'in vec3 vWorld; in vec3 vN; in vec2 vUV; in vec4 vCol; in vec4 vTint; out vec4 oColor;',

    '  vec3 col = vec3(.012, .011, .010) * (uSkyAmb * .6 + .3);',

  /* additive light-cone volumes / flat glow quads share this one */
  S.volFS = [
    'precision highp float;',
    'in vec3 vWorld; in vec3 vN; in vec2 vUV; in vec4 vCol; in vec4 vTint; out vec4 oColor;',
    'uniform vec3 uCam; uniform vec4 uBase;',

    '  vec3 V = normalize(uCam - vWorld); float f = pow(abs(dot(normalize(vN), V)), 1.5);',

    '}'

  /* ------------------------------------------------------------ post processing */
  var POST_VS = 'precision highp float; out vec2 vUV; void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUV = p; gl_Position = vec4(p * 2. - 1., 0., 1.); }';
  S.postVS = POST_VS;
  S.bloomDownFS = [
    'precision highp float; in vec2 vUV; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel; uniform float uFirst; uniform float uThresh;',
    'vec3 pre(vec3 c){ float l = max(max(c.r, c.g), c.b); float k = max(l - uThresh, 0.) / max(l, 1e-4); return c * k; }',
    'void main(){',
    '  vec2 t = uTexel;',
    '  vec3 a = texture(uTex, vUV + t * vec2(-2, 2)).rgb, b = texture(uTex, vUV + t * vec2(0, 2)).rgb, c = texture(uTex, vUV + t * vec2(2, 2)).rgb;',
    '  vec3 d = texture(uTex, vUV + t * vec2(-2, 0)).rgb, e = texture(uTex, vUV).rgb, f = texture(uTex, vUV + t * vec2(2, 0)).rgb;',
    '  vec3 g = texture(uTex, vUV + t * vec2(-2, -2)).rgb, h = texture(uTex, vUV + t * vec2(0, -2)).rgb, i = texture(uTex, vUV + t * vec2(2, -2)).rgb;',
    '  vec3 j = texture(uTex, vUV + t * vec2(-1, 1)).rgb, k = texture(uTex, vUV + t * vec2(1, 1)).rgb, l = texture(uTex, vUV + t * vec2(-1, -1)).rgb, m = texture(uTex, vUV + t * vec2(1, -1)).rgb;',
    '  if (uFirst > .5) { a = pre(a); b = pre(b); c = pre(c); d = pre(d); e = pre(e); f = pre(f); g = pre(g); h = pre(h); i = pre(i); j = pre(j); k = pre(k); l = pre(l); m = pre(m); }',

  ].join('\n');
  S.bloomUpFS = [
    'precision highp float; in vec2 vUV; out vec4 o; uniform sampler2D uTex; uniform vec2 uTexel; uniform float uRadius;',
    'void main(){',
    '  vec2 t = uTexel * uRadius;',
    '  vec3 s = texture(uTex, vUV).rgb * 4.;',
    '  s += texture(uTex, vUV + vec2(-t.x, 0)).rgb * 2. + texture(uTex, vUV + vec2(t.x, 0)).rgb * 2. + texture(uTex, vUV + vec2(0, -t.y)).rgb * 2. + texture(uTex, vUV + vec2(0, t.y)).rgb * 2.;',
    '  s += texture(uTex, vUV + vec2(-t.x, -t.y)).rgb + texture(uTex, vUV + vec2(t.x, -t.y)).rgb + texture(uTex, vUV + vec2(-t.x, t.y)).rgb + texture(uTex, vUV + vec2(t.x, t.y)).rgb;',
    '  o = vec4(s / 16., 1.); }'
  ].join('\n');
  S.compositeFS = [
    'precision highp float; in vec2 vUV; out vec4 o;',
    'uniform sampler2D uScene; uniform sampler2D uBloom; uniform sampler2D uDepth;',
    'uniform float uExposure; uniform float uBloomAmt; uniform float uVig; uniform float uGrain; uniform float uTime;',
    'uniform float uMotion; uniform vec2 uMotionCenter; uniform float uDof; uniform float uFocus; uniform vec2 uNearFar; uniform vec2 uTexel;',
    'uniform float uSat; uniform vec3 uTint; uniform float uContrast; uniform float uRainLens; uniform float uFade; uniform float uAberr;',
    'float linD(float d){ float z = d * 2. - 1.; return 2. * uNearFar.x * uNearFar.y / (uNearFar.y + uNearFar.x - z * (uNearFar.y - uNearFar.x)); }',
    'vec3 aces(vec3 x){ const float a = 2.51, b = .03, c = 2.43, d = .59, e = .14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0., 1.); }',
    'float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
    'void main(){',
    '  vec2 uv = vUV;',
    '  vec2 dc = uv - uMotionCenter; float rr = length(dc);',
    '  vec3 col;',
    '  vec2 ab = dc * uAberr * (rr * rr);',

      var cx = (m[0] * X + m[4] * Y + m[8] * Z + m[12]) / cw, cy = (m[1] * X + m[5] * Y + m[9] * Z + m[13]) / cw; if (Math.abs(cx) > 1.1 || Math.abs(cy) > 1.1) continue;
      out.push({ x: (cx * 0.5 + 0.5) * ui.W, y: (1 - (cy * 0.5 + 0.5)) * ui.H, name: c.name, place: c.race.place, d: Math.hypot(v.x - me.vehicle.x, v.z - me.vehicle.z), ahead: c.race.place < me.race.place });
    }
    return out;
  };
})();
</script>
